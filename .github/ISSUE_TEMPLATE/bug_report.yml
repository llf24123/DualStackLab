name: 问题反馈 / Bug report
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 issue。涉及 ROOT、静默安装、特定机型的问题请务必填写设备信息。
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 关于页面或 APK 文件名里的版本号（如 0.6.13 / versionCode 19）
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 机型、Android 版本、ROM（如 OnePlus 13 / Android 16 / ColorOS 16）
    validations:
      required: true
  - type: dropdown
    id: root
    attributes:
      label: ROOT 状态
      options:
        - 未 ROOT
        - Magisk
        - KernelSU
        - APatch
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: |
        `adb logcat -s DualStackLab AndroidRuntime` 的输出，或终端页面右上角的输出日志。
        请先删除文件路径中的个人信息。
    validations:
      required: false
